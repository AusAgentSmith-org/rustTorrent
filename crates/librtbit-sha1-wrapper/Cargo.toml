[package]
name = "librtbit-sha1-wrapper"
version = "0.1.2"
edition = "2024"
description = "Pluggable SHA1/SHA256 abstraction for the rtbit BitTorrent client"
license = "MIT"
repository = "https://github.com/TheDancingDeveloper-org/rustTorrent"

[features]
default = ["sha1-crypto-hash"]
sha1-crypto-hash = ["crypto-hash"]
sha1-ring = ["aws-lc-rs"]

[dependencies]
assert_cfg = "0.1"
crypto-hash = { version = "0.3", optional = true }
aws-lc-rs = { version = "1.17", optional = true }

[dev-dependencies]
hex = "0.4"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused = "warn"
