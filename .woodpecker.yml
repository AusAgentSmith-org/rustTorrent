when:
  - event: push
    branch: main
  - event: tag
  - event: manual
  - event: pull_request

steps:
  - name: fmt
    image: rust:1.95-bookworm
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
      RUSTC_WRAPPER: sccache
      SCCACHE_REDIS: "redis://100.92.54.45:6380"
    commands:
      - curl -sSfL "https://github.com/mozilla/sccache/releases/download/v0.8.2/sccache-v0.8.2-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C /tmp && mv /tmp/sccache-v0.8.2-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
      - git config --global url."http://x-access-token:$GIT_AUTH_TOKEN@100.92.54.45:3002/".insteadOf "http://100.92.54.45:3002/"
      - printf '[registries.forgejo]\nindex = "sparse+https://repo.indexarr.net/api/packages/indexarr/cargo/"\ncredential-provider = "cargo:token"\n\n[registry]\ndefault = "forgejo"\n' > $CARGO_HOME/config.toml
      - printf '[registries.forgejo]\ntoken = "Bearer %s"\n' "$GIT_AUTH_TOKEN" > $CARGO_HOME/credentials.toml
      - sed -i '/^\[patch\./,$ d' Cargo.toml
      - rustup component add rustfmt
      - cargo fmt --all -- --check

  - name: check
    image: rust:1.95-bookworm
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
      RUSTC_WRAPPER: sccache
      SCCACHE_REDIS: "redis://100.92.54.45:6380"
    commands:
      - curl -sSfL "https://github.com/mozilla/sccache/releases/download/v0.8.2/sccache-v0.8.2-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C /tmp && mv /tmp/sccache-v0.8.2-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
      - git config --global url."http://x-access-token:$GIT_AUTH_TOKEN@100.92.54.45:3002/".insteadOf "http://100.92.54.45:3002/"
      - printf '[registries.forgejo]\nindex = "sparse+https://repo.indexarr.net/api/packages/indexarr/cargo/"\ncredential-provider = "cargo:token"\n\n[registry]\ndefault = "forgejo"\n' > $CARGO_HOME/config.toml
      - printf '[registries.forgejo]\ntoken = "Bearer %s"\n' "$GIT_AUTH_TOKEN" > $CARGO_HOME/credentials.toml
      - sed -i '/^\[patch\./,$ d' Cargo.toml
      - cargo check --workspace --exclude rtbit-desktop --no-default-features --features default-tls
      - sccache --show-stats

  - name: test
    image: rust:1.95-bookworm
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
      RUSTC_WRAPPER: sccache
      SCCACHE_REDIS: "redis://100.92.54.45:6380"
    commands:
      - curl -sSfL "https://github.com/mozilla/sccache/releases/download/v0.8.2/sccache-v0.8.2-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C /tmp && mv /tmp/sccache-v0.8.2-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
      - git config --global url."http://x-access-token:$GIT_AUTH_TOKEN@100.92.54.45:3002/".insteadOf "http://100.92.54.45:3002/"
      - printf '[registries.forgejo]\nindex = "sparse+https://repo.indexarr.net/api/packages/indexarr/cargo/"\ncredential-provider = "cargo:token"\n\n[registry]\ndefault = "forgejo"\n' > $CARGO_HOME/config.toml
      - printf '[registries.forgejo]\ntoken = "Bearer %s"\n' "$GIT_AUTH_TOKEN" > $CARGO_HOME/credentials.toml
      - sed -i '/^\[patch\./,$ d' Cargo.toml
      - cargo test --workspace --exclude rtbit-desktop --no-default-features --features default-tls

  - name: clippy
    image: rust:1.95-bookworm
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
      RUSTC_WRAPPER: sccache
      SCCACHE_REDIS: "redis://100.92.54.45:6380"
    commands:
      - curl -sSfL "https://github.com/mozilla/sccache/releases/download/v0.8.2/sccache-v0.8.2-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C /tmp && mv /tmp/sccache-v0.8.2-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
      - git config --global url."http://x-access-token:$GIT_AUTH_TOKEN@100.92.54.45:3002/".insteadOf "http://100.92.54.45:3002/"
      - printf '[registries.forgejo]\nindex = "sparse+https://repo.indexarr.net/api/packages/indexarr/cargo/"\ncredential-provider = "cargo:token"\n\n[registry]\ndefault = "forgejo"\n' > $CARGO_HOME/config.toml
      - printf '[registries.forgejo]\ntoken = "Bearer %s"\n' "$GIT_AUTH_TOKEN" > $CARGO_HOME/credentials.toml
      - sed -i '/^\[patch\./,$ d' Cargo.toml
      - rustup component add clippy
      - cargo clippy --workspace --exclude rtbit-desktop --no-default-features --features default-tls -- -D warnings

  - name: webui
    image: node:24-bookworm
    commands:
      - cd crates/librtbit/webui
      - npm ci --no-audit --no-fund
      - npm test
      - npm run lint
      - npm run build

  - name: gui-e2e
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    commands:
      - cd crates/librtbit/webui
      - npm ci --no-audit --no-fund
      - npm run test:e2e

  - name: website-check
    image: alpine:3.23
    commands:
      - ci/tasks/website-check

  - name: github-preflight
    image: alpine:3.23
    when:
      - event: push
        branch: main
      - event: tag
    depends_on:
      - website-check
    environment:
      GH_TOKEN:
        from_secret: gh_release_token
    commands:
      - apk add --no-cache curl jq
      - ci/tasks/github-preflight

  - name: website-deploy
    image: alpine:3.23
    when:
      - event: push
        branch: main
    depends_on:
      - github-preflight
    environment:
      DEPLOY_SSH_KEY:
        from_secret: deploy_ssh_key
    commands:
      - apk add --no-cache openssh-client rsync
      - ci/tasks/deploy-website

  - name: build-linux
    image: rust:1.95-bookworm
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
      RUSTC_WRAPPER: sccache
      SCCACHE_REDIS: "redis://100.92.54.45:6380"
    commands:
      - curl -sSfL "https://github.com/mozilla/sccache/releases/download/v0.8.2/sccache-v0.8.2-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C /tmp && mv /tmp/sccache-v0.8.2-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
      - git config --global url."http://x-access-token:$GIT_AUTH_TOKEN@100.92.54.45:3002/".insteadOf "http://100.92.54.45:3002/"
      - printf '[registries.forgejo]\nindex = "sparse+https://repo.indexarr.net/api/packages/indexarr/cargo/"\ncredential-provider = "cargo:token"\n\n[registry]\ndefault = "forgejo"\n' > $CARGO_HOME/config.toml
      - printf '[registries.forgejo]\ntoken = "Bearer %s"\n' "$GIT_AUTH_TOKEN" > $CARGO_HOME/credentials.toml
      - sed -i '/^\[patch\./,$ d' Cargo.toml
      - if [ -n "$CI_COMMIT_TAG" ]; then export CARGO_PROFILE_RELEASE_LTO=fat CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1 CARGO_PROFILE_RELEASE_STRIP=symbols; fi
      - cargo build --profile release-github -p rtbit --no-default-features --features default-tls
      - ls -lh target/release-github/rtbit
      - if [ -n "$CI_COMMIT_TAG" ]; then cargo install cargo-deb --registry crates-io && cargo deb -p rtbit --no-build --no-strip --profile release-github -o target/release-github/rtbit_amd64.deb && ls -lh target/release-github/rtbit_amd64.deb; fi
    when:
      - event: push
        branch: main
      - event: tag
    depends_on:
      - github-preflight

  - name: build-windows
    image: rust:1.95-bookworm
    environment:
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
      RUSTC_WRAPPER: sccache
      SCCACHE_REDIS: "redis://100.92.54.45:6380"
    commands:
      - curl -sSfL "https://github.com/mozilla/sccache/releases/download/v0.8.2/sccache-v0.8.2-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C /tmp && mv /tmp/sccache-v0.8.2-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
      - git config --global url."http://x-access-token:$GIT_AUTH_TOKEN@100.92.54.45:3002/".insteadOf "http://100.92.54.45:3002/"
      - printf '[registries.forgejo]\nindex = "sparse+https://repo.indexarr.net/api/packages/indexarr/cargo/"\ncredential-provider = "cargo:token"\n\n[registry]\ndefault = "forgejo"\n' > $CARGO_HOME/config.toml
      - printf '[registries.forgejo]\ntoken = "Bearer %s"\n' "$GIT_AUTH_TOKEN" > $CARGO_HOME/credentials.toml
      - sed -i '/^\[patch\./,$ d' Cargo.toml
      - apt-get update && apt-get install -y gcc-mingw-w64-x86-64 nasm
      - rustup target add x86_64-pc-windows-gnu
      - if [ -n "$CI_COMMIT_TAG" ]; then export CARGO_PROFILE_RELEASE_LTO=fat CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1 CARGO_PROFILE_RELEASE_STRIP=symbols; fi
      - cargo build --profile release-github -p rtbit --target x86_64-pc-windows-gnu --no-default-features --features default-tls
      - ls -lh target/x86_64-pc-windows-gnu/release-github/rtbit.exe
    when:
      - event: push
        branch: main
      - event: tag
    depends_on:
      - build-linux

  - name: publish-release
    image: alpine:3.23
    when:
      - event: tag
    depends_on:
      - verify-release-images
    environment:
      DEPLOY_SSH_KEY:
        from_secret: deploy_ssh_key
    commands:
      - apk add --no-cache openssh-client coreutils
      - mkdir -p ~/.ssh
      - echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
      - chmod 600 ~/.ssh/id_ed25519
      - ssh-keyscan -H 100.92.4.57 >> ~/.ssh/known_hosts 2>/dev/null || true
      - echo "Publishing release $CI_COMMIT_TAG"
      - cp target/release-github/rtbit "rtbit-$CI_COMMIT_TAG-linux-x86_64"
      - cp target/x86_64-pc-windows-gnu/release-github/rtbit.exe "rtbit-$CI_COMMIT_TAG-windows-x86_64.exe"
      - cp target/release-github/rtbit_amd64.deb "rtbit-$CI_COMMIT_TAG-amd64.deb" 2>/dev/null || true
      - |
        set -e
        TAG="$CI_COMMIT_TAG"
        sha256sum rtbit-$TAG-* > "SHA256SUMS-$TAG.txt"
        ssh -o StrictHostKeyChecking=accept-new root@100.92.4.57 "mkdir -p /root/downloads/rusttorrent/$TAG"
        scp -o StrictHostKeyChecking=accept-new rtbit-$TAG-* "SHA256SUMS-$TAG.txt" root@100.92.4.57:/root/downloads/rusttorrent/$TAG/
        ssh -o StrictHostKeyChecking=accept-new root@100.92.4.57 "cd /root/downloads/rusttorrent/$TAG && ln -sf rtbit-$TAG-linux-x86_64 rtbit-linux-x86_64 && ln -sf rtbit-$TAG-windows-x86_64.exe rtbit-windows-x86_64.exe"
        ssh -o StrictHostKeyChecking=accept-new root@100.92.4.57 "ln -sfn $TAG /root/downloads/rusttorrent/latest"
      - echo "Published https://dl.rusttorrent.dev/latest/"

  - name: forgejo-release
    image: alpine:3.23
    when:
      - event: tag
    depends_on:
      - publish-release
    environment:
      FORGEJO_TOKEN:
        from_secret: git_auth_token
    commands:
      - apk add --no-cache curl jq
      - |
        TAG="$CI_COMMIT_TAG"
        API="https://repo.indexarr.net/api/v1"
        REPO="indexarr/rustTorrent"
        NOTES="$CI_WORKSPACE/RELEASE_NOTES_$TAG.md"
        test -f "$NOTES"
        echo "$TAG" | grep -qE '(alpha|beta|rc)' && PRERELEASE=true || PRERELEASE=false
        echo "Creating Forgejo release $TAG (prerelease=$PRERELEASE)"

        # Delete existing release by tag if present (idempotent retry)
        EXISTING_ID=$(curl -s -H "Authorization: token $FORGEJO_TOKEN" \
          "$API/repos/$REPO/releases/tags/$TAG" | jq -r '.id // empty')
        if [ -n "$EXISTING_ID" ]; then
          echo "Deleting existing release ID=$EXISTING_ID"
          curl -s -X DELETE -H "Authorization: token $FORGEJO_TOKEN" \
            "$API/repos/$REPO/releases/$EXISTING_ID"
        fi

        jq -n \
          --arg tag "$TAG" \
          --arg name "rustTorrent $TAG" \
          --rawfile body "$NOTES" \
          --argjson prerelease "$PRERELEASE" \
          '{tag_name:$tag,name:$name,body:$body,draft:false,prerelease:$prerelease}' \
          > /tmp/forgejo-release.json
        RELEASE_ID=$(curl -s -X POST \
          -H "Authorization: token $FORGEJO_TOKEN" \
          -H "Content-Type: application/json" \
          --data-binary @/tmp/forgejo-release.json \
          "$API/repos/$REPO/releases" | jq -r '.id')

        if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
          echo "ERROR: Failed to create Forgejo release"; exit 1
        fi
        echo "Forgejo release created: ID=$RELEASE_ID"

        for file in "rtbit-$TAG-linux-x86_64" "rtbit-$TAG-windows-x86_64.exe" "rtbit-$TAG-amd64.deb" "SHA256SUMS-$TAG.txt"; do
          [ -f "$file" ] || continue
          echo "Uploading $file"
          curl -sf -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -F "attachment=@$file" \
            "$API/repos/$REPO/releases/$RELEASE_ID/assets" > /dev/null
        done
        echo "Forgejo release $TAG complete"

  - name: build-and-push
    image: woodpeckerci/plugin-docker-buildx
    when:
      - event: push
    depends_on:
      - build-windows
    settings:
      repo: repo.indexarr.net/indexarr/rusttorrent
      registry: repo.indexarr.net
      username:
        from_secret: git_auth_token
      password:
        from_secret: git_auth_token
      tag: ["dev", "${CI_COMMIT_SHA}"]
      default_labels: false
      labels:
        - org.opencontainers.image.source=https://github.com/AusAgentSmith-org/rustTorrent
        - org.opencontainers.image.url=https://github.com/AusAgentSmith-org/rustTorrent
        - org.opencontainers.image.title=rustTorrent
        - org.opencontainers.image.description=A modern BitTorrent client written in Rust
      build_args_from_env:
        - PLUGIN_PASSWORD

  - name: push-ghcr-dev
    image: quay.io/skopeo/stable
    when:
      - event: push
        branch: main
    depends_on:
      - build-and-push
    environment:
      GH_TOKEN:
        from_secret: gh_release_token
      FORGEJO_TOKEN:
        from_secret: git_auth_token
    commands:
      - SRC="docker://repo.indexarr.net/indexarr/rusttorrent:$CI_COMMIT_SHA"
      - SRC_CREDS="--src-creds=$FORGEJO_TOKEN:$FORGEJO_TOKEN"
      - DST_CREDS="--dest-creds=AusAgentSmith:$GH_TOKEN"
      - skopeo copy $SRC_CREDS $DST_CREDS $SRC "docker://ghcr.io/ausagentsmith-org/rusttorrent:$CI_COMMIT_SHA"
      - skopeo copy $SRC_CREDS $DST_CREDS $SRC "docker://ghcr.io/ausagentsmith-org/rusttorrent:dev"

  - name: mirror-github-main
    image: alpine:3.23
    when:
      - event: push
        branch: main
    depends_on:
      - push-ghcr-dev
    environment:
      GH_TOKEN:
        from_secret: gh_release_token
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
    commands:
      - apk add --no-cache git
      - ci/tasks/mirror-github branch

  - name: build-and-push-release
    image: woodpeckerci/plugin-docker-buildx
    when:
      - event: tag
    depends_on:
      - build-windows
    settings:
      repo: repo.indexarr.net/indexarr/rusttorrent
      registry: repo.indexarr.net
      username:
        from_secret: git_auth_token
      password:
        from_secret: git_auth_token
      platforms: linux/amd64,linux/arm64
      tag: ["${CI_COMMIT_TAG}", latest, beta]
      default_labels: false
      labels:
        - org.opencontainers.image.source=https://github.com/AusAgentSmith-org/rustTorrent
        - org.opencontainers.image.url=https://github.com/AusAgentSmith-org/rustTorrent
        - org.opencontainers.image.title=rustTorrent
        - org.opencontainers.image.description=A modern BitTorrent client written in Rust
      build_args_from_env:
        - PLUGIN_PASSWORD

  - name: push-ghcr
    image: quay.io/skopeo/stable
    when:
      - event: tag
    depends_on:
      - build-and-push-release
    environment:
      GH_TOKEN:
        from_secret: gh_release_token
      FORGEJO_TOKEN:
        from_secret: git_auth_token
    commands:
      - SRC="docker://repo.indexarr.net/indexarr/rusttorrent:$CI_COMMIT_TAG"
      - SRC_CREDS="--src-creds=$FORGEJO_TOKEN:$FORGEJO_TOKEN"
      - DST_CREDS="--dest-creds=AusAgentSmith:$GH_TOKEN"
      - for tag in $CI_COMMIT_TAG latest beta; do skopeo copy --all $SRC_CREDS $DST_CREDS $SRC "docker://ghcr.io/ausagentsmith-org/rusttorrent:$tag"; done

  - name: verify-release-images
    image: quay.io/skopeo/stable
    when:
      - event: tag
    depends_on:
      - push-ghcr
    environment:
      GH_TOKEN:
        from_secret: gh_release_token
      FORGEJO_TOKEN:
        from_secret: git_auth_token
    commands:
      - for tag in $CI_COMMIT_TAG latest beta; do for arch in amd64 arm64; do skopeo inspect --creds "$FORGEJO_TOKEN:$FORGEJO_TOKEN" --override-arch "$arch" "docker://repo.indexarr.net/indexarr/rusttorrent:$tag" >/dev/null; skopeo inspect --creds "AusAgentSmith:$GH_TOKEN" --override-arch "$arch" "docker://ghcr.io/ausagentsmith-org/rusttorrent:$tag" >/dev/null; done; done

  - name: mirror-github-tag
    image: alpine:3.23
    when:
      - event: tag
    depends_on:
      - verify-release-images
    environment:
      GH_TOKEN:
        from_secret: gh_release_token
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
    commands:
      - apk add --no-cache git
      - ci/tasks/mirror-github tag

  - name: github-release
    image: alpine:3.23
    when:
      - event: tag
    depends_on:
      - mirror-github-tag
      - publish-release
    environment:
      GH_TOKEN:
        from_secret: gh_release_token
    commands:
      - apk add --no-cache curl jq
      - |
        TAG="$CI_COMMIT_TAG"
        REPO="AusAgentSmith-org/rustTorrent"
        NOTES="$CI_WORKSPACE/RELEASE_NOTES_$TAG.md"
        test -f "$NOTES"
        PRERELEASE=false
        echo "Creating GitHub release $TAG as a full release"

        # Delete existing release by tag if present (idempotent retry)
        EXISTING_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
          "https://api.github.com/repos/$REPO/releases/tags/$TAG" | jq -r '.id // empty')
        if [ -n "$EXISTING_ID" ]; then
          echo "Deleting existing GitHub release ID=$EXISTING_ID"
          curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/$EXISTING_ID"
        fi

        jq -n \
          --arg tag "$TAG" \
          --arg name "rustTorrent $TAG" \
          --rawfile body "$NOTES" \
          --argjson prerelease "$PRERELEASE" \
          '{tag_name:$tag,target_commitish:"main",name:$name,body:$body,draft:false,prerelease:$prerelease}' \
          > /tmp/github-release.json
        RELEASE_ID=$(curl -s -X POST \
          -H "Authorization: token $GH_TOKEN" \
          -H "Content-Type: application/json" \
          --data-binary @/tmp/github-release.json \
          "https://api.github.com/repos/$REPO/releases" | jq -r '.id')

        if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
          echo "ERROR: Failed to create GitHub release"; exit 1
        fi
        echo "Release created: ID=$RELEASE_ID"

        for file in "rtbit-$TAG-linux-x86_64" "rtbit-$TAG-windows-x86_64.exe" "rtbit-$TAG-amd64.deb" "SHA256SUMS-$TAG.txt"; do
          [ -f "$file" ] || continue
          echo "Uploading $file"
          curl -sf -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$file" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$file" > /dev/null
        done
        echo "GitHub release $TAG complete"

  - name: verify-release
    image: alpine:3.23
    when:
      - event: tag
    depends_on:
      - forgejo-release
      - github-release
    environment:
      GH_TOKEN:
        from_secret: gh_release_token
      FORGEJO_TOKEN:
        from_secret: git_auth_token
      GIT_AUTH_TOKEN:
        from_secret: git_auth_token
    commands:
      - apk add --no-cache curl git jq
      - ci/tasks/verify-release

  - name: discord-success
    image: alpine/curl
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        HASH=$(echo $CI_COMMIT_SHA | head -c 7)
        curl -sf -H "Content-Type: application/json" -d "{
          \"embeds\": [{
            \"title\": \"Build Successful\",
            \"description\": \"**${CI_REPO}** — [$HASH]($CI_REPO_URL/commit/$CI_COMMIT_SHA)\",
            \"color\": 5025616,
            \"footer\": {\"text\": \"$CI_REPO • $CI_COMMIT_AUTHOR\"},
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
          }]
        }" "$DISCORD_WEBHOOK_URL" || true
    when:
      - status: [success]

  - name: discord-failure
    image: alpine/curl
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        HASH=$(echo $CI_COMMIT_SHA | head -c 7)
        curl -sf -H "Content-Type: application/json" -d "{
          \"embeds\": [{
            \"title\": \"Build Failed\",
            \"description\": \"**${CI_REPO}** — [$HASH]($CI_REPO_URL/commit/$CI_COMMIT_SHA)\",
            \"color\": 15548997,
            \"footer\": {\"text\": \"$CI_REPO • $CI_COMMIT_AUTHOR\"},
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
          }]
        }" "$DISCORD_WEBHOOK_URL" || true
    when:
      - status: [failure]
