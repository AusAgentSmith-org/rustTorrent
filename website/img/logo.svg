<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ce422b"/>
      <stop offset="100%" style="stop-color:#e04e35"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="#1c2333"/>
  <g transform="translate(60,60)">
    <!-- Torrent arrows forming a cycle -->
    <path d="M-8,-30 L8,-30 L0,-42Z" fill="url(#g)"/>
    <path d="M30,-8 L30,8 L42,0Z" fill="url(#g)"/>
    <path d="M-8,30 L8,30 L0,42Z" fill="url(#g)"/>
    <path d="M-30,-8 L-30,8 L-42,0Z" fill="url(#g)"/>
    <!-- Center circle -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="url(#g)" stroke-width="3"/>
    <!-- R letter -->
    <text x="0" y="6" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#e4e8f0" text-anchor="middle">rT</text>
  </g>
</svg>
